services:
  db:
    # image: postgres:18
    # Use the pgvector image to prepare for AI in the Enterprise Edition.
    image: pgvector/pgvector:pg18
    user: root
    environment:
      - POSTGRES_USER=odoo
      - POSTGRES_PASSWORD=odoo19@2026
      - POSTGRES_DB=postgres
    restart: always             # run as a service
    volumes:
        - ./postgresql:/var/lib/postgresql

  odoo19:
    image: odoo:19
    user: root
    depends_on:
      - db
    ports:
      - "10019:8069"
      - "20019:8072" # live chat
    tty: true
    command: --
    environment:
      - HOST=db
      - USER=odoo
      - PASSWORD=odoo19@2026
    volumes:
      #- /etc/timezone:/etc/timezone:ro
      #- /etc/localtime:/etc/localtime:ro
      - ./entrypoint.sh:/entrypoint.sh
      - ./addons:/mnt/extra-addons
      - ./etc:/etc/odoo
      - ./odoo_data:/var/lib/odoo
    restart: always             # run as a service
    
  pgadmin4:
    image: dpage/pgadmin4:latest
    hostname: pgadmin
    depends_on:
      - db
    ports:
      - "8080:80"
    environment:
      - PGADMIN_DEFAULT_EMAIL=user@domain.com
      - PGADMIN_DEFAULT_PASSWORD=password
      - PGADMIN_CONFIG_ENCHANCED_COOKIE_PROTECTION=False
    volumes:
      - pgadmin-data:/var/lib/pgadmin
    restart: always             # run as a service

volumes:
  # odoo-web-data:
  #   external: true
  # odoo-db-data:
  #   external: true
  pgadmin-data:
    external: true